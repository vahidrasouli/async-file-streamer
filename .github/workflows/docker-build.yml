name: Build and Push to GitHub Registry

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🌟 اعطای دسترسی به گیت‌هاب اکشن برای نوشتن ایمیج در پکیج‌های داخلی خود گیت‌هاب
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # 🌟 لاگین به سیستم داخلی گیت‌هاب به جای داکرهاب (بدون نیاز به تنظیم دستی Secret)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🌟 استفاده از متغیرهای خودکار گیت‌هاب برای نام‌گذاری ریپازیتوری
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # تگ‌گذاری هوشمند با شماره ورژن اکشن
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ github.run_number }}
          # کش کردن لایه‌ها در خود گیت‌هاب برای بیلد‌های زیر ۳۰ ثانیه
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max